name: ✅ فحص الترجمة (بلا أسرار)

# ════════════════════════════════════════════════════════════════════════
#  هذا هو سير العمل الذي تشغّله **أولًا**.
#  لا يحتاج أي أسرار ولا شهادات ولا حساب مطوّر — غرضه الوحيد:
#
#      هل تُترجم الشيفرة بنجاح على watchOS؟
#
#  فيبني التطبيق والودجت بصيغة Debug مع تعطيل التوقيع
#  (CODE_SIGNING_ALLOWED=NO)، ويفحص المخطّطين:
#     • project.yml           (تطبيق ساعة مستقل)
#     • project-container.yml (مع حاوية iOS لـ TestFlight)
#
#  ⏱️ المدة المتوقعة: 5–8 دقائق للنسخة الأولى (تنزيل XcodeGen + ترجمة).
# ════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # ← زر «Run workflow» اليدوي

concurrency:
  group: tasbih-contract-check-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # ① فحوصات سريعة على الملفات (بلا Mac — ثوانٍ)
  # ─────────────────────────────────────────────
  quick-checks:
    name: 🔍 فحوصات الملفات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔎 تحديد مجلد المشروع تلقائيًا
        # ⚠️ مهم: ملفات المشروع قد تكون في جذر المستودع أو داخل مجلد فرعي
        #    (يحدث عند رفع المجلد نفسه). هذه الخطوة تجعل السير عمل يعمل في الحالتين.
        run: |
          SPEC_FILE="$(find . -name project.yml -not -path '*/node_modules/*' | head -1)"
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ لم أجد ملف project.yml في المستودع"
            echo "## ❌ لم أجد ملفات المشروع" >> "$GITHUB_STEP_SUMMARY"
            echo "تأكد أنك رفعت محتويات مجلد المشروع كاملة." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SPEC_FILE")" >> "$GITHUB_ENV"
          echo "✅ وجدت المشروع في: $(dirname "$SPEC_FILE")"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت PyYAML
        run: pip install pyyaml

      - name: 🧩 صياغة Swift بالمترجم الرسمي (ثوانٍ — يسبق سيرفر macOS)
        # درس من فحص الترجمة: فاصلة واحدة ناقصة في Shared.swift أوقفت ترجمة الودجت
        # على سيرفر أبل بعد أن مرّت بقية الفحوصات. هذه الخطوة تكشفها فورًا.
        # (إن لم يوجد مترجم Swift على السيرفر تُتخطّى بلا فشل.)
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tests/swift-syntax-check.sh

      - name: فحص واجهات Swift وتطابق الأذكار وصلاحية App Group
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tests/swift-api-check.py

      - name: فحص المحاكي (تفاعل + منطق)
        working-directory: ${{ env.PROJECT_DIR }}/tests
        run: |
          npm install jsdom --silent
          node jsdom-suite.mjs

      - name: 📋 ملخّص سريع
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ الفحوصات السريعة نجحت" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ الفحوصات السريعة وجدت مشكلة"
              echo ""
              echo "افتح الخطوة التي عليها ❌ في هذه الصفحة، ثم أرسل لي آخر ٢٠ سطرًا منها."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────
  # ② الترجمة الفعلية على سيرفر macOS
  # ─────────────────────────────────────────────
  compile:
    name: 🛠️ ${{ matrix.label }}
    needs: quick-checks
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # ① تطبيق الساعة المستقل (المسار A)
          - key: standalone
            spec: project.yml
            scheme: Tasbih
            destination: generic/platform=watchOS
            label: ترجمة تطبيق الساعة (مستقل)
          # ② حاوية iOS (المسار B — للنشر في TestFlight)
          - key: container-ios
            spec: project-container.yml
            scheme: TasbihContainer
            destination: generic/platform=iOS
            label: ترجمة حاوية iOS (للنشر)
          # ③ تطبيق الساعة داخل مشروع الحاوية (تأكيد أن المسارين سليمان)
          - key: container-watch
            spec: project-container.yml
            scheme: Tasbih
            destination: generic/platform=watchOS
            label: ترجمة تطبيق الساعة (داخل الحاوية)
    env:
      SPEC: ${{ matrix.spec }}
      SCHEME: ${{ matrix.scheme }}
      BUILD_DESTINATION: ${{ matrix.destination }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔎 تحديد مجلد المشروع تلقائيًا
        # ⚠️ مهم: ملفات المشروع قد تكون في جذر المستودع أو داخل مجلد فرعي
        #    (يحدث عند رفع المجلد نفسه). هذه الخطوة تجعل السير عمل يعمل في الحالتين.
        run: |
          SPEC_FILE="$(find . -name project.yml -not -path '*/node_modules/*' | head -1)"
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ لم أجد ملف project.yml في المستودع"
            echo "## ❌ لم أجد ملفات المشروع" >> "$GITHUB_STEP_SUMMARY"
            echo "تأكد أنك رفعت محتويات مجلد المشروع كاملة." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SPEC_FILE")" >> "$GITHUB_ENV"
          echo "✅ وجدت المشروع في: $(dirname "$SPEC_FILE")"

      - name: أحدث Xcode على السيرفر
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: تثبيت XcodeGen
        run: brew install xcodegen

      - name: توليد مشروع Xcode من ${{ matrix.spec }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate --spec "$SPEC"

      - name: 🧭 تشخيص المشروع والوجهات (يظهر في صندوق الملخّص)
        # بلا هذه الخطوة نضطر لتخمين سبب أخطاء «لا توجد وجهة» أو الهدف المفقود.
        # الآن يظهر كل شيء في صندوق الملخّص أعلى صفحة التشغيل بلا فتح أي سجل.
        if: always()
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        run: |
          {
            echo "### 🧭 تشخيص — ${{ matrix.label }}"
            echo ""
            echo "المخطط: \`${{ matrix.scheme }}\` · الوجهة: \`${{ matrix.destination }}\`"
            echo ""
            echo "**أهداف ومخططات المشروع:**"
            echo '```'
            xcodebuild -list -project Tasbih.xcodeproj 2>&1 || true
            echo '```'
            echo "**الوجهات المتاحة لهذا المخطط:**"
            echo '```'
            xcodebuild -showdestinations -project Tasbih.xcodeproj -scheme "$SCHEME" 2>&1 | head -25 || true
            echo '```'
            echo "**إعدادات المنصّة لهدف $SCHEME:**"
            echo '```'
            xcodebuild -showBuildSettings -project Tasbih.xcodeproj -target "$SCHEME" 2>&1 \
              | grep -E "PLATFORM_NAME|SUPPORTED_PLATFORMS|PRODUCT_NAME|TARGETED_DEVICE_FAMILY|SDKROOT" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🛠️ ترجمة بلا توقيع — ${{ matrix.label }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Tasbih.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$BUILD_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            -resultBundlePath build/${{ matrix.spec }}.xcresult \
            2>&1 | tee build-log-${{ matrix.key }}.txt | tail -80

      - name: 📋 ملخّص النتيجة
        if: always()
        working-directory: ${{ env.PROJECT_DIR || '.' }}
        run: |
          echo "════════ ${{ matrix.spec }} — ${{ matrix.label }} ════════"
          if grep -q "BUILD SUCCEEDED" build-log-${{ matrix.key }}.txt 2>/dev/null; then
            echo "✅ BUILD SUCCEEDED"
            {
              echo "## ✅ نجحت الترجمة — ${{ matrix.label }}"
              echo ""
              echo "**معناها:** الشيفرة سليمة وتُبنى بلا أخطاء. لا تفعل شيئًا."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ BUILD FAILED — الأخطاء:"
            ERRORS="$(grep -E 'error:' build-log-${{ matrix.key }}.txt | sort -u | head -40 || true)"
            echo "$ERRORS"
            echo
            echo "⚠️ تحذيرات (لا توقف البناء):"
            grep -E "warning:" build-log-${{ matrix.key }}.txt | sort -u | head -20 || true
            {
              echo "## ❌ فشلت الترجمة — ${{ matrix.label }}"
              echo ""
              echo "### 🟥 هذه هي الأخطاء — انسخها وأرسلها للمساعد (أو أرسل صورة للشاشة):"
              echo ""
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: رفع سجل البناء (للتنزيل عند الفشل)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.key }}   # ← فريد: مدخلان يشتركان في spec نفسه
          path: ${{ env.PROJECT_DIR || '.' }}/build-log-${{ matrix.key }}.txt
          retention-days: 14
